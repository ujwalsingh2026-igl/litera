  <rect width="64" height="64" rx="14" fill="#1c1917"/>
  
  <!-- Subtle Translucent Inner Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#fafaf9" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Open Book Base Silhouette -->
  <path d="M16 43C21 41 27 41.5 32 44C37 41.5 43 41 48 43V23C43 21 37 21.5 32 24C27 21.5 21 21 16 23V43Z" 
